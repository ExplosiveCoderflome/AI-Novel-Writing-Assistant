name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pg-live-gate:
    uses: ./.github/workflows/pg-live-gate.yml

  publish-release:
    needs: pg-live-gate
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    env:
      AI_NOVEL_RELEASE_CHANNEL: release
      AI_NOVEL_ALLOW_UNSIGNED_RELEASE: "true"
      AI_NOVEL_GITHUB_OWNER: ExplosiveCoderflome
      AI_NOVEL_GITHUB_REPO: AI-Novel-Writing-Assistant
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v6
        with:
          name: pg-live-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp

      - name: Build and stage desktop app
        run: pnpm stage:desktop

      - name: Verify database migrations
        run: pnpm --filter @ai-novel/server exec node --test tests/prismaMigrationCompleteness.test.js tests/runtimeMigrations.test.js

      - name: Verify server production and architecture boundaries
        run: pnpm --filter @ai-novel/server test:quality

      - name: Verify packaged desktop layout
        run: pnpm verify:desktop-package:reuse-stage

      - name: Publish desktop release to GitHub Releases
        run: pnpm publish:desktop:release:reuse-stage

      - name: Update GitHub release notes
        run: node scripts/update-desktop-release-notes.cjs

  publish-mac:
    needs: pg-live-gate
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      AI_NOVEL_RELEASE_CHANNEL: release
      AI_NOVEL_DATABASE_MODE: sqlite
      DATABASE_URL: file:./dev.db
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NODE_OPTIONS: --max-old-space-size=6144
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v6
        with:
          name: pg-live-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp
      - run: pnpm stage:desktop
      - name: Verify packaging contracts
        run: node --test desktop/tests/*.test.cjs
      - name: Publish unsigned DMG
        run: node desktop/scripts/run-electron-builder.cjs --mac dmg --${{ matrix.arch }} --publish always

  publish-linux:
    needs: pg-live-gate
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      AI_NOVEL_RELEASE_CHANNEL: release
      AI_NOVEL_DATABASE_MODE: sqlite
      DATABASE_URL: file:./dev.db
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v6
        with:
          name: pg-live-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp
      - run: pnpm stage:desktop
      - name: Verify packaging contracts
        run: node --test desktop/tests/*.test.cjs
      - name: Publish AppImage
        run: node desktop/scripts/run-electron-builder.cjs --linux AppImage --x64 --publish always

  verify-only:
    needs: pg-live-gate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v6
        with:
          name: pg-live-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp
      - name: Verify release checks without uploading
        run: node scripts/desktop-release/check.cjs
      - run: pnpm stage:desktop
      - name: Verify Windows package without publishing
        run: node desktop/scripts/run-electron-builder.cjs --dir --win --x64 --publish never
      - run: node desktop/scripts/verify-desktop-package.cjs
