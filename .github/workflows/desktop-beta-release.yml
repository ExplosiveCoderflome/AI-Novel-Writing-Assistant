name: Desktop Beta Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-beta-v*"

permissions:
  contents: write

jobs:
  pg-live-gate:
    uses: ./.github/workflows/pg-live-gate.yml

  release-checks:
    needs: pg-live-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v6
        with:
          name: pg-live-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp
      - name: Run portable release checks
        run: node scripts/desktop-release/run.cjs
      - uses: actions/upload-artifact@v6
        with:
          name: release-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/release-checks/release-checks-${{ github.run_id }}-${{ github.run_attempt }}.json
          include-hidden-files: true
          if-no-files-found: error

  publish-beta:
    needs: [pg-live-gate, release-checks]
    runs-on: windows-latest
    env:
      AI_NOVEL_RELEASE_CHANNEL: beta
      AI_NOVEL_GITHUB_OWNER: ExplosiveCoderflome
      AI_NOVEL_GITHUB_REPO: AI-Novel-Writing-Assistant
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v6
        with:
          name: pg-live-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp
      - uses: actions/download-artifact@v6
        with:
          name: release-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/release-checks
      - name: Verify release proofs
        run: node scripts/desktop-release/verify-proof.cjs

      - name: Install desktop icon tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Regenerate desktop icon assets
        run: python desktop/scripts/generate-desktop-icons.py

      - name: Build and stage desktop app
        run: pnpm stage:desktop

      - name: Verify database migrations
        run: pnpm --filter @ai-novel/server exec node --test tests/prismaMigrationCompleteness.test.js tests/runtimeMigrations.test.js

      - name: Verify server production and architecture boundaries
        run: pnpm --filter @ai-novel/server test:quality

      - name: Verify packaged desktop layout
        run: pnpm verify:desktop-package:reuse-stage

      - name: Publish beta installer to GitHub Releases
        run: pnpm publish:desktop:beta:reuse-stage

      - name: Update GitHub release notes
        run: node scripts/update-desktop-release-notes.cjs
